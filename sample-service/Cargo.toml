[package]
name = "cicada-sample-service"
description = "A runnable Cicada node with the examples and the HTTP API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
axum.workspace = true
chrono.workspace = true
cicada.workspace = true
cicada-axum.workspace = true
cicada-examples.workspace = true
cicada-extras.workspace = true
cicada-otel.workspace = true
cicada-store-postgres.workspace = true
cicada-store-sqlite.workspace = true
opentelemetry.workspace = true
# OTLP over HTTP/protobuf (port 4318). The blocking reqwest
# client suits the SDK's batch processors, which export from their own threads.
opentelemetry-otlp = { version = "0.33.0", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace", "metrics"] }
opentelemetry_sdk.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
cicada-client.workspace = true
cicada-test.workspace = true
reqwest.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true

[package]
name = "cicada-sample-service"
description = "A runnable Cicada node with the examples and the HTTP API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
axum.workspace = true
chrono.workspace = true
cicada.workspace = true
# Both stores, and the terminal UI so that a build of the workspace has every feature of cicada-app on.
cicada-app = { workspace = true, features = ["sqlite", "postgres", "tui"] }
cicada-examples.workspace = true
cicada-actors.workspace = true
cicada-otel.workspace = true
opentelemetry.workspace = true
# OTLP over HTTP/protobuf (port 4318). The blocking reqwest
# client suits the SDK's batch processors, which export from their own threads.
opentelemetry-otlp = { version = "0.33.0", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace", "metrics"] }
opentelemetry_sdk.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
cicada-axum.workspace = true
cicada-client.workspace = true
cicada-test.workspace = true
reqwest.workspace = true
# tests/contract_snapshots.rs compares the text of each contract by its SHA-256.
sha2.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true

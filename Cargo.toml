[workspace]
resolver = "3"
members = [
    "crates/cicada",
    "crates/cicada-test",
    "crates/cicada-axum",
    "crates/cicada-client",
    "crates/cicada-otel",
    "crates/cicada-actors",
    "crates/cicada-app",
    "examples",
    "sample-service",
    "e2e",
]

[workspace.package]
version = "0.16.14"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
publish = false
repository = "https://github.com/helico-tech/cicada.rs"

[workspace.dependencies]
cicada = { path = "crates/cicada" }
cicada-test = { path = "crates/cicada-test" }
cicada-axum = { path = "crates/cicada-axum" }
cicada-client = { path = "crates/cicada-client" }
cicada-otel = { path = "crates/cicada-otel" }
cicada-actors = { path = "crates/cicada-actors" }
cicada-app = { path = "crates/cicada-app" }
cicada-examples = { path = "examples" }

aide = { version = "=0.16.0-alpha.4", features = ["axum", "axum-json", "axum-query"] }
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = "0.8.9"
chrono = { version = "0.4.42", default-features = false, features = ["std", "clock", "serde"] }
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = "0.3.34"
http = "1"
http-body = "1.1.0"
jsonschema = { version = "0.61.1", default-features = false }
opentelemetry = "0.33.0"
opentelemetry_sdk = "0.33.0"
peak_alloc = "0.3.0"
proptest = "1.12.0"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
schemars = { version = "1.2.2", features = ["preserve_order", "chrono04"] }
serde = { version = "1", features = ["derive"] }
serde_norway = "0.9.42"
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "json", "chrono"] }
tempfile = "3"
thiserror = "2.0.21"
toml = "1.2.1"
tokio = { version = "1.53.2", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
tower = { version = "0.5", features = ["util"] }
tower-http = "0.7.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
uuid = { version = "1.27.0", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[package]
name = "cicada-examples"
description = "Worked examples of Cicada actor types, each with tests."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
cicada.workspace = true
cicada-actors.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
thiserror.workspace = true

[dev-dependencies]
# The code blocks of the README, the guides and the operations guide run as doctests of this crate (src/lib.rs).
anyhow.workspace = true
# The README, the guides and the operations guide open both stores.
cicada = { workspace = true, features = ["sqlite", "postgres"] }
async-trait.workspace = true
axum.workspace = true
cicada-app = { workspace = true, features = ["sqlite", "postgres"] }
cicada-axum.workspace = true
cicada-client.workspace = true
cicada-otel.workspace = true
cicada-test.workspace = true
# The core guide follows a stream of change hints.
futures.workspace = true
# tests/docs.rs writes small trees of Markdown files.
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber.workspace = true

[lints]
workspace = true

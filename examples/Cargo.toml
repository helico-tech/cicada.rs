[package]
name = "cicada-examples"
description = "Worked examples of Cicada actor types, each with tests."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
cicada.workspace = true
cicada-actors.workspace = true
# Example 15 runs a worker over HTTP.
cicada-client.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
thiserror.workspace = true
# Example 20 serves a websocket session: axum's ws feature is turned on only here.
axum = { workspace = true, features = ["ws"] }
futures.workspace = true
tokio.workspace = true
tokio-util.workspace = true

[dev-dependencies]
# The code blocks of the README, the guides and the operations guide run as doctests of this crate (src/lib.rs).
anyhow.workspace = true
# The README, the guides and the operations guide open both stores.
cicada = { workspace = true, features = ["sqlite", "postgres"] }
async-trait.workspace = true
cicada-app = { workspace = true, features = ["sqlite", "postgres"] }
cicada-axum.workspace = true
cicada-otel.workspace = true
cicada-test.workspace = true
# tests/docs.rs writes small trees of Markdown files.
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
# Example 20's test connects a websocket client to its axum route.
tokio-tungstenite.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true

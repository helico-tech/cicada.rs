<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>myapp settings window</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.t{--label:rgba(0,0,0,0.86);--secondary:rgba(0,0,0,0.52);--sep:rgba(0,0,0,0.09);--win:#f3f3f5;--titlebar:#ececee;--group:#ffffff;--groupedge:rgba(0,0,0,0.09);--ctrl:#ffffff;--ctrledge:rgba(0,0,0,0.2);--fill:rgba(0,0,0,0.1);--blue:#007aff;--focus:rgba(0,122,255,0.45);--desk:linear-gradient(155deg,#9bb8d8 0%,#c4b6dc 52%,#ecc6ae 100%)}
.t.dark{--label:rgba(255,255,255,0.88);--secondary:rgba(255,255,255,0.56);--sep:rgba(255,255,255,0.1);--win:#1f1f21;--titlebar:#2a2a2c;--group:rgba(255,255,255,0.05);--groupedge:rgba(255,255,255,0.09);--ctrl:rgba(255,255,255,0.14);--ctrledge:rgba(255,255,255,0.12);--fill:rgba(255,255,255,0.16);--blue:#0a84ff;--focus:rgba(10,132,255,0.55);--desk:linear-gradient(155deg,#1b2a44 0%,#35294a 55%,#4a3130 100%)}
.t{position:relative;overflow:hidden;background:var(--desk);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;font-size:13px;line-height:16px;color:var(--label);-webkit-font-smoothing:antialiased}
.win{position:absolute;box-sizing:border-box;border-radius:12px;overflow:hidden;background:var(--win);box-shadow:0 0 0 0.5px rgba(0,0,0,0.25),0 22px 60px rgba(0,0,0,0.35)}
.gtitle{margin:0 2px 6px;font-size:13px;font-weight:600}
.group{border-radius:10px;background:var(--group);box-shadow:0 0 0 0.5px var(--groupedge)}
.grow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:40px;padding:0 12px;box-sizing:border-box}
.grow + .grow{border-top:0.5px solid var(--sep)}
.sec{font-size:11px;line-height:14px;color:var(--secondary)}
.fld{height:22px;box-sizing:border-box;padding:0 7px;border:0;border-radius:5px;background:var(--ctrl);box-shadow:0 0 0 0.5px var(--ctrledge);color:var(--label);font:inherit;font-size:13px}
.fld:focus{outline:none;box-shadow:0 0 0 3px var(--focus)}
.pop{position:relative;display:flex;align-items:center}
.pop select{appearance:none;-webkit-appearance:none;height:22px;box-sizing:border-box;padding:0 26px 0 9px;border:0;border-radius:5px;background:var(--ctrl);box-shadow:0 0 0 0.5px var(--ctrledge),0 1px 1px rgba(0,0,0,0.06);color:var(--label);font:inherit;font-size:13px}
.pop select:focus{outline:none;box-shadow:0 0 0 3px var(--focus)}
.pop svg{position:absolute;right:7px;pointer-events:none;color:var(--secondary)}
.btn{height:22px;padding:0 12px;border:0;border-radius:5px;background:var(--ctrl);box-shadow:0 0 0 0.5px var(--ctrledge),0 1px 1px rgba(0,0,0,0.06);color:var(--label);font:inherit;font-size:13px;text-decoration:none;display:inline-flex;align-items:center;cursor:default}
.btn.def{background:var(--blue);color:#ffffff;box-shadow:none}
.btn:focus-visible{outline:none;box-shadow:0 0 0 3px var(--focus)}
.sw{position:relative;display:inline-block;width:26px;height:15px}
.sw input{position:absolute;inset:0;margin:0;opacity:0;cursor:default}
.sw span{position:absolute;inset:0;border-radius:8px;background:var(--fill);pointer-events:none}
.sw span::after{content:"";position:absolute;top:1.5px;left:1.5px;width:12px;height:12px;border-radius:50%;background:#ffffff;box-shadow:0 1px 2px rgba(0,0,0,0.3)}
.sw input:checked + span{background:var(--blue)}
.sw input:checked + span::after{left:12.5px}
.sw input:focus-visible + span{box-shadow:0 0 0 3px var(--focus)}
.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:12px}
.num{font-variant-numeric:tabular-nums}
</style>
</helmet>
<div class="t {{theme}}" style="width: 680px; height: 600px">
<section class="win" aria-label="myapp Settings" style="left: 40px; top: 36px; width: 600px">
<div style="position: relative; display: flex; align-items: center; justify-content: center; height: 52px; background: var(--titlebar); border-bottom: 0.5px solid var(--sep)">
<div style="position: absolute; left: 18px; display: flex; gap: 8px" aria-hidden="true">
<span style="width: 12px; height: 12px; border-radius: 50%; background: #ff5f57; box-shadow: inset 0 0 0 0.5px rgba(0,0,0,0.15)"></span>
<span style="width: 12px; height: 12px; border-radius: 50%; background: #febc2e; box-shadow: inset 0 0 0 0.5px rgba(0,0,0,0.15)"></span>
<span style="width: 12px; height: 12px; border-radius: 50%; background: #28c840; box-shadow: inset 0 0 0 0.5px rgba(0,0,0,0.15)"></span>
</div>
<span style="font-weight: 600">myapp Settings</span>
</div>

<form style="display: flex; flex-direction: column; gap: 18px; padding: 18px 20px 4px">
<div>
<h2 class="gtitle">Connection</h2>
<div class="group">
<div class="grow">
<label for="ctx">Context</label>
<div style="display: flex; gap: 8px; align-items: center">
<span class="pop">
<select id="ctx">
<option>prod</option>
<option>staging</option>
<option>local</option>
</select>
<svg width="9" height="12" viewBox="0 0 9 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m1.5 4.5 3-3 3 3"></path><path d="m1.5 7.5 3 3 3-3"></path></svg>
</span>
<button class="btn" type="button">Add…</button>
</div>
</div>
<div class="grow">
<label for="url">Server</label>
<input id="url" class="fld mono" type="url" value="https://actors.internal" style="width: 260px">
</div>
<div class="grow">
<label for="tok">Token</label>
<input id="tok" class="fld" type="password" value="xxxxxxxxxxxxxxxx" style="width: 260px">
</div>
</div>
</div>

<div>
<h2 class="gtitle">Worker</h2>
<div class="group">
<sc-for list="{{types}}" as="ty" hint-placeholder-count="4">
<div class="grow" style="min-height: 36px">
<label for="{{ty.id}}" style="display: flex; flex-direction: column">
<span class="mono" style="font-size: 13px">{{ty.name}}</span>
</label>
<span class="sw"><input id="{{ty.id}}" type="checkbox" checked="{{ty.on}}"><span></span></span>
</div>
</sc-for>
<div class="grow">
<label for="lim" style="display: flex; flex-direction: column; gap: 1px">
<span>Turns at once</span>
<span class="sec">The worker's concurrency</span>
</label>
<div style="display: flex; align-items: center; gap: 4px">
<input id="lim" class="fld num" type="number" min="1" value="4" style="width: 48px; text-align: right">
</div>
</div>
</div>
</div>
</form>

<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 20px 18px">
<span class="sec">Contexts are shared with <span class="mono" style="font-size: 11px">cicada config</span>.</span>
<div style="display: flex; gap: 8px">
<a class="btn" href="Main.dc.html">Revert</a>
<a class="btn def" href="Main.dc.html">Apply and Reconnect</a>
</div>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":680,"height":600}}'>
class Component extends DCLogic {
renderVals() {
return {
theme: this.props.dark ? 'dark' : '',
types: [
{ id: 'ty-reports', name: 'reports', on: true },
{ id: 'ty-invoices', name: 'invoices', on: true },
{ id: 'ty-mailer', name: 'mailer', on: true },
{ id: 'ty-audit', name: 'audit', on: false }
]
};
}
}
</script>
</body>
</html>

[package]
name = "cicada-actors"
description = "Ready-made actors on Cicada: a supervisor, dead letters, a topic, a scheduler, a rate limiter, a debouncer, a batcher, a permit pool, a heartbeat watch, a node-down monitor and an event that starts flows; durable flows; and schedules."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

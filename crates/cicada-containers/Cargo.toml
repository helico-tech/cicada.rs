[package]
name = "cicada-containers"
description = "A container runtime trait, its types and a fake, and a reconciled container actor, shared by Cicada applications that run containers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# `FakeRuntime`, an in-memory runtime for tests. Only dev-dependencies turn it on (the examples' guide doctests).
testing = []
# `DockerRuntime`, the backend over the Docker Engine API (bollard).
docker = ["dep:base64", "dep:bollard", "dep:futures", "dep:sha2", "dep:tar", "dep:tokio-util"]

[dependencies]
async-trait.workspace = true
# Decodes the `auth` entries of Docker's config.json for a pull.
base64 = { workspace = true, optional = true }
bollard = { workspace = true, optional = true }
# The container actor runs on Cicada's public API; no store feature: the host picks its store.
cicada.workspace = true
futures = { workspace = true, optional = true }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
# The folder names of Docker CLI contexts, `contexts/meta/<sha256 of the name>`.
sha2 = { workspace = true, optional = true }
tar = { workspace = true, optional = true }
thiserror.workspace = true
# The log archiver's rounds, reads and timers; the Docker backend's streams.
tokio.workspace = true
# `copy_out` reads Docker's archive stream as a blocking reader for `tar`.
tokio-util = { workspace = true, optional = true, features = ["io", "io-util"] }
# What the log archiver logs: it keeps going through every error.
tracing.workspace = true

[dev-dependencies]
# The actor's tests: `TestActors` on virtual time, the fake runtime, and the sample checks of the HTTP door.
cicada-axum.workspace = true
cicada-containers = { path = ".", features = ["testing"] }
cicada-test.workspace = true
# The config folders and credential helper scripts of the Docker backend's tests.
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true

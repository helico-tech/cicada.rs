[package]
name = "cicada-containers"
description = "A container runtime trait, its types and a fake, shared by Cicada applications that run containers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# `FakeRuntime`, an in-memory runtime for tests. Nothing in the workspace turns it on.
testing = []
# `DockerRuntime`, the backend over the Docker Engine API (bollard).
docker = ["dep:bollard", "dep:futures", "dep:tar", "dep:tokio"]

[dependencies]
async-trait.workspace = true
bollard = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
tar = { workspace = true, optional = true }
thiserror.workspace = true
tokio = { workspace = true, optional = true }

[lints]
workspace = true

[package]
name = "cicada"
description = "Durable actors on a shared SQL store: addressing, definition API, runtime and the SQLite and PostgreSQL stores."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# None is on by default: a host names the store it uses and builds only that driver. PostgreSQL comes with TLS:
# rustls on aws-lc-rs, the crypto provider of the HTTP client, trusting the built-in list of public CAs.
sqlite = ["dep:sqlx", "sqlx/sqlite"]
postgres = ["dep:sqlx", "sqlx/postgres", "sqlx/tls-rustls-aws-lc-rs"]
# The in-memory store, the test clocks and `TestActors`; turned on by `cicada-test`.
testing = []

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
futures.workspace = true
chrono.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx = { workspace = true, optional = true }
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
uuid.workspace = true
whoami.workspace = true

[dev-dependencies]
# The crate itself with every feature, so that its unit tests and its tests in `tests/` run on every store.
cicada = { path = ".", features = ["sqlite", "postgres", "testing"] }
proptest.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true

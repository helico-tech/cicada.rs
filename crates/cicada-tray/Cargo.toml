[package]
name = "cicada-tray"
description = "A macOS menu bar app and portable controls for a Cicada worker over HTTP."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
chrono.workspace = true
cicada.workspace = true
cicada-app.workspace = true
serde.workspace = true
tempfile.workspace = true
tokio.workspace = true
toml.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std", "block2", "NSAccessibilityProtocols", "NSAppearance", "NSAttributedString", "NSApplication", "NSBezierPath", "NSBox", "NSButton",
    "NSButtonCell", "NSCell", "NSColor", "NSControl", "NSEvent", "NSFont", "NSFontDescriptor", "NSGraphics", "NSGraphicsContext",
    "NSImage", "NSMenu", "NSMenuItem", "NSMenuItemBadge", "NSParagraphStyle", "NSPopUpButton", "NSProgressIndicator",
    "NSResponder", "NSRunningApplication", "NSScrollView", "NSSecureTextField", "NSStatusBar", "NSStatusBarButton",
    "NSStatusItem", "NSStepper", "NSStringDrawing", "NSSwitch", "NSText", "NSTextField", "NSView", "NSWindow", "objc2-core-foundation",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std", "NSArray", "NSAttributedString", "NSBundle", "NSDictionary", "NSGeometry", "NSObject", "NSProcessInfo", "NSRunLoop", "NSString", "NSTimer",
] }

[dev-dependencies]
axum.workspace = true
cicada-axum.workspace = true
cicada-test.workspace = true
schemars.workspace = true
tokio = { workspace = true, features = ["test-util"] }

# Keep these in sync with [workspace.lints]. Only unsafe_code differs so the appkit module can allow AppKit calls.
[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

# Build, lint and test on every push to main and every pull request. The E2E suite (cicada-e2e, CICADA_E2E=1) is not
# run here.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs the same checks on a version tag.
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      # The PostgreSQL store's tests and conformance suite run when CICADA_PG_URL is set.
      postgres:
        image: postgres:17.5-alpine
        env:
          POSTGRES_USER: cicada
          POSTGRES_PASSWORD: cicada
          POSTGRES_DB: cicada
        options: >-
          --health-cmd "pg_isready -U cicada" --health-interval 2s --health-timeout 2s --health-retries 20
        ports:
          - 55432:5432
    env:
      CICADA_PG_URL: postgres://cicada:cicada@localhost:55432/cicada
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # The service container allows 100 connections; the PostgreSQL tests of cicada hold at most 4 databases at once.
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # `cargo test --workspace` turns every feature of cicada on, so each feature is also built alone: no feature,
      # only SQLite, only PostgreSQL, only the test support.
      - name: Build cicada with each feature alone
        shell: bash
        env:
          RUSTFLAGS: -D warnings
        run: |
          set -euo pipefail
          cargo check -p cicada
          cargo check -p cicada --features sqlite
          cargo check -p cicada --features postgres
          cargo check -p cicada --features testing
      # The trees go to files first, so a `cargo tree` that fails fails the step; the first two greps check that the
      # trees hold what each feature must build. SQLite builds no TLS library. The whole workspace, on every target and
      # with its dev-dependencies, builds rustls with one crypto provider: with both ring and aws-lc-rs, every caller
      # that leaves the choice to rustls panics.
      - name: Each store feature builds only its own driver
        shell: bash
        run: |
          set -euo pipefail
          trees="${RUNNER_TEMP:-/tmp}"
          cargo tree -p cicada -e normal > "$trees/none.txt"
          cargo tree -p cicada -e normal --features sqlite > "$trees/sqlite.txt"
          cargo tree -p cicada -e normal --features postgres > "$trees/postgres.txt"
          cargo tree --workspace --target all -f '{p} [{f}]' --prefix none > "$trees/workspace.txt"
          grep -q sqlx-sqlite "$trees/sqlite.txt" || { echo "sqlite does not build the SQLite driver"; exit 1; }
          grep -q sqlx-postgres "$trees/postgres.txt" || { echo "postgres does not build the PostgreSQL driver"; exit 1; }
          if grep -q sqlx "$trees/none.txt"; then echo "no feature builds sqlx"; exit 1; fi
          if grep -q sqlx-postgres "$trees/sqlite.txt"; then echo "sqlite builds the PostgreSQL driver"; exit 1; fi
          if grep -qE 'sqlx-sqlite|libsqlite3-sys' "$trees/postgres.txt"; then echo "postgres builds the SQLite driver"; exit 1; fi
          if grep -qE 'rustls|native-tls' "$trees/sqlite.txt"; then echo "sqlite builds a TLS library"; exit 1; fi
          if awk '/^rustls v/ && /[[,]ring[],]/ && /[[,]aws_lc_rs[],]/ { two = 1 } END { exit !two }' "$trees/workspace.txt"; then
            echo "the workspace builds rustls with two crypto providers, ring and aws-lc-rs"; exit 1
          fi

# Build, lint and test on every push to main and every pull request. The E2E suite (cicada-e2e, CICADA_E2E=1) is not
# run here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      # The PostgreSQL store's tests and conformance suite run when CICADA_PG_URL is set.
      postgres:
        image: postgres:17.5-alpine
        env:
          POSTGRES_USER: cicada
          POSTGRES_PASSWORD: cicada
          POSTGRES_DB: cicada
        options: >-
          --health-cmd "pg_isready -U cicada" --health-interval 2s --health-timeout 2s --health-retries 20
        ports:
          - 55432:5432
    env:
      CICADA_PG_URL: postgres://cicada:cicada@localhost:55432/cicada
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # The service container allows 100 connections; the PostgreSQL conformance fixture runs at most 4 cases at once.
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

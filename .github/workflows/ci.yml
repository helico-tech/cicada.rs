# The full check policy on Linux, started by hand only (ADR 0046). Pushes, pull requests and tags start no workflow:
# the local gate (scripts/gate.py) records evidence and publishes releases. This run records no evidence and publishes
# nothing; it adds Linux coverage when a maintainer wants it. The E2E suite is not run here.
name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      # The PostgreSQL store's tests and conformance suite need it: the gate sets CICADA_PG_URL from CICADA_GATE_PG_URL.
      postgres:
        image: postgres:17.5-alpine
        env:
          POSTGRES_USER: cicada
          POSTGRES_PASSWORD: cicada
          POSTGRES_DB: cicada
        options: >-
          --health-cmd "pg_isready -U cicada" --health-interval 2s --health-timeout 2s --health-retries 20
        ports:
          - 55432:5432
    env:
      CICADA_GATE_PG_URL: postgres://cicada:cicada@localhost:55432/cicada
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # The same commands as the local full gate, from scripts/gate-policy.json and scripts/ci/.
      - run: python3 scripts/gate.py checks --scope full

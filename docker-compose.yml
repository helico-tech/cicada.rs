services:
  postgres:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_USER: cicada
      POSTGRES_PASSWORD: cicada
      POSTGRES_DB: cicada
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cicada"]
      interval: 2s
      timeout: 2s
      retries: 20
